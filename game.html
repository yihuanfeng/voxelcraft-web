<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxelCraft 网页版</title>
<link rel="stylesheet" href="./css/main.css?v=33">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<div id="game"></div>

<!-- 准星 / 特效层 -->
<div id="crosshair"></div>
<div id="minebar"><div></div></div>
    <div id="blockinfo"></div>
    <div id="airbar"></div>
<div id="flash"></div>
<div id="watertint"></div>

<!-- HUD -->
<div id="hud">
  <div id="debug"></div>
  <div id="hearts"></div>
  <div id="hotbar"></div>
</div>

<!-- 主菜单 -->
<div id="menu">
  <div class="menu-card">
    <h1>VoxelCraft 网页版</h1>
    <div class="menu-sub" id="menuSubtitle">网页版迷你沙盒世界</div>
    <div class="menu-ops">
      <b>WASD</b> 移动 &nbsp; <b>空格</b> 跳跃 &nbsp; <b>Shift</b> 疾跑<br>
      <b>鼠标左键</b> 挖掘 / 攻击 &nbsp; <b>鼠标右键</b> 放置方块<br>
      <b>E</b> 打开背包（合成、配方书、盔甲、背包 27 格）&nbsp; <b>Q</b> 丢弃手中物品<br>
      <b>右键</b> 对着工作台可打开 3×3 合成 &nbsp; <b>M</b> 打开地图（绿=村庄 紫=传送门）<br>
      <b>传送门</b>：找到紫色门框走进去即入下界；自建需 <b>钻石镐</b> 挖黑曜石，摆成 <b>高5宽2</b> 的 10 块门框自动激活<br>
      <b>1-9</b> 或 <b>点击</b> 切换快捷栏 &nbsp; <b>F</b> 飞行 &nbsp; <b>C</b> 下降
    </div>
    <button class="btn" id="playBtn">▶  开始游戏</button>
    <div class="toggle-row">
      <input type="checkbox" id="peacefulToggle">
      <label for="peacefulToggle">🕊 和平模式（无怪物）</label>
    </div>
    <div class="btn-row">
      <button class="btn sm" id="saveNowBtn">💾  保存进度</button>
      <button class="btn sm warn" id="resetSaveBtn">🗑  清除存档</button>
    </div>
    <div class="save-status" id="saveStatus">💾 游戏进度会自动保存在当前浏览器中（也可手动保存）</div>
  </div>
</div>

<!-- 死亡界面 -->
<div id="deathScreen">
  <h2>你死了</h2>
  <div id="deathMsg"></div>
  <button class="btn" id="respawnBtn">🔄  重新出生</button>
</div>

<!-- 背包界面（原版布局：合成+小人 / 配方书 / 背包与快捷栏连成一条） -->
<div id="inventoryUI">
  <div class="inv-panel mc-panel">
    <div class="inv-head">
      <span class="inv-title">🎒</span>
      <button class="inv-close" id="closeInvBtn" title="关闭 (E)">✕</button>
    </div>
    <div class="mc-top">
      <div class="mc-craft">
        <div class="craft-2x2">
          <div class="is-slot empty" id="craftSlot0"></div>
          <div class="is-slot empty" id="craftSlot1"></div>
          <div class="is-slot empty" id="craftSlot2"></div>
          <div class="is-slot empty" id="craftSlot3"></div>
        </div>
        <div class="craft-arrow">→</div>
        <div id="craftResult" class="empty" title="合成结果（点击取走）"></div>
      </div>
      <div class="mc-player">
        <canvas id="playerModel" class="player-model" width="96" height="128" title="角色装备预览"></canvas>
        <div class="armor-col" id="armorGrid"></div>
      </div>
    </div>
    <div class="mc-recipebook">
      <div class="recipe-strip" id="recipeList"></div>
    </div>
    <div class="mc-bag">
      <div class="inv-grid inv-grid-9" id="invGrid"></div>
      <div class="inv-grid inv-hotbar" id="invHotbar"></div>
    </div>
  </div>
</div>

<!-- 工作台界面（原版布局，3×3 合成） -->
<div id="tableUI">
  <div class="inv-panel mc-panel table-panel">
    <div class="inv-head">
      <span class="inv-title">🛠</span>
      <button class="inv-close" id="closeTableBtn" title="关闭 (Esc)">✕</button>
    </div>
    <div class="mc-top table-top">
      <div class="mc-craft">
        <div class="craft-3x3">
          <div class="is-slot empty" id="tableSlot0"></div>
          <div class="is-slot empty" id="tableSlot1"></div>
          <div class="is-slot empty" id="tableSlot2"></div>
          <div class="is-slot empty" id="tableSlot3"></div>
          <div class="is-slot empty" id="tableSlot4"></div>
          <div class="is-slot empty" id="tableSlot5"></div>
          <div class="is-slot empty" id="tableSlot6"></div>
          <div class="is-slot empty" id="tableSlot7"></div>
          <div class="is-slot empty" id="tableSlot8"></div>
        </div>
        <div class="craft-arrow">→</div>
        <div id="tableResult" class="empty" title="合成结果（点击取走）"></div>
      </div>
    </div>
    <div class="mc-recipebook">
      <div class="recipe-strip" id="tableRecipeList"></div>
    </div>
    <div class="mc-bag">
      <div class="inv-grid inv-grid-9" id="tableInvGrid"></div>
      <div class="inv-grid inv-hotbar" id="tableHotbar"></div>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
